<!DOCTYPE html>
<html lang="id" data-skin="arcade">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catatan Keuangan Bulanan</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root,:root[data-skin="arcade"]{--bg:#140A2E;--card:#201249;--ink:#F6F0FF;--mute:#B2A4D9;--line:#3A2A78;--in:#3DFFB0;--out:#FF4F93;--save:#52C7FF;--glow:#B26BFF;--bt:#04131C;--hg:linear-gradient(135deg,#5A12E8,#B22FF2 50%,#F2418A);color-scheme:dark}
:root[data-skin="sakura"]{--bg:#FFF1F6;--card:#FFFFFF;--ink:#4B1D36;--mute:#8F6377;--line:#F6CFDD;--in:#0F9E78;--out:#E0356A;--save:#6C5CE7;--glow:#FF7EB0;--bt:#FFFFFF;--hg:linear-gradient(135deg,#E83E78,#F5688F 50%,#FF9A6E);color-scheme:light}
:root[data-skin="samudra"]{--bg:#06182B;--card:#0B2A47;--ink:#E7F6FF;--mute:#8FB4CC;--line:#17476E;--in:#2CF2C0;--out:#FF7A8A;--save:#5CB8FF;--glow:#2CC8FF;--bt:#04131C;--hg:linear-gradient(135deg,#0A4C92,#0E8FB8 55%,#17BFA0);color-scheme:dark}
:root[data-skin="galaksi"]{--bg:#0A0B1E;--card:#14163A;--ink:#EEF0FF;--mute:#9AA0D6;--line:#2B2F6B;--in:#7DF9C5;--out:#FF6B9D;--save:#FFD166;--glow:#7C83FF;--bt:#07091C;--hg:linear-gradient(135deg,#1B1F8F,#6A2BD9 55%,#B84DF0);color-scheme:dark}
:root[data-skin="matcha"]{--bg:#F1F7EC;--card:#FFFFFF;--ink:#20361F;--mute:#6B8466;--line:#D2E4C6;--in:#2E9E4E;--out:#D8473C;--save:#3B7DD8;--glow:#7BC96F;--bt:#FFFFFF;--hg:linear-gradient(135deg,#25683A,#3E9150 55%,#76AE45);color-scheme:light}
:root[data-skin="boba"]{--bg:#F6F0FF;--card:#FFFFFF;--ink:#3A2660;--mute:#7E6BA6;--line:#E0D2F7;--in:#1FA67A;--out:#E34E8A;--save:#7F5AF0;--glow:#B392FF;--bt:#FFFFFF;--hg:linear-gradient(135deg,#6F48E0,#A06AF0 55%,#E479BC);color-scheme:light}
:root[data-skin="emas"]{--bg:#14100A;--card:#1F1910;--ink:#FBF1D9;--mute:#BFA878;--line:#4A3B1E;--in:#8BE28B;--out:#FF7A66;--save:#F5C14B;--glow:#F5B52E;--bt:#1A1203;--hg:linear-gradient(135deg,#6B4300,#B87A0A 55%,#D9A02A);color-scheme:dark}
:root[data-skin="cyber"]{--bg:#07090F;--card:#0E1520;--ink:#E8FBFF;--mute:#7FA3B3;--line:#1C3A4A;--in:#00F5A0;--out:#FF2E7E;--save:#00D4FF;--glow:#FFE600;--bt:#03080C;--hg:linear-gradient(135deg,#0B1F3A,#0A6C8F 50%,#E0225F);color-scheme:dark}
:root[data-skin="permen"]{--bg:#FFFBE6;--card:#FFFFFF;--ink:#3D2A5C;--mute:#86719B;--line:#FFE3A3;--in:#19A974;--out:#FF4E6A;--save:#3D8BFF;--glow:#FFC93C;--bt:#FFFFFF;--hg:linear-gradient(135deg,#F0307A,#F96E3A 50%,#EE9A1A);color-scheme:light}
:root[data-skin="sunset"]{--bg:#FFF4E5;--card:#FFFFFF;--ink:#3B2118;--mute:#8A6A58;--line:#F6D9B8;--in:#12945F;--out:#D9342B;--save:#7A4CE0;--glow:#FF9A3C;--bt:#FFFFFF;--hg:linear-gradient(135deg,#D92B3A,#F2602F 55%,#EE8A1F);color-scheme:light}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);background:var(--bg);font:400 16px/1.5 "Fredoka",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
main{width:100%;max-width:1040px;margin:0 auto;padding:20px 16px 56px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
main>*{min-width:0}
h1{margin:0;font-size:clamp(1.5rem,5vw,2rem);font-weight:700;color:var(--ink)}
h2{margin:0 0 12px;font-size:1.05rem;font-weight:600}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;transition:transform .1s,filter .15s}
button:active{transform:scale(.94)}
:focus-visible{outline:2px solid var(--save);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.nav{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
.nav b{min-width:128px;text-align:center;font-weight:600;text-transform:capitalize}
.ib{width:42px;height:42px;border:0;border-radius:50%;background:transparent;font-size:1.2rem;line-height:1}
.ib:hover{background:var(--bg)}
.sync{margin:-6px 0 0;font-size:.85rem;color:var(--mute)}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.hero{position:relative;overflow:hidden;border:0;color:#fff;padding:22px;background:var(--hg);--out:#FF8FA3;--save:#9CC0FF;--in:#7CF0C0}
.hero .lbl{margin:0;padding-right:62px;color:rgba(255,255,255,.85)}
.big{margin:14px 0;font-size:clamp(2rem,9vw,3.8rem);font-weight:700;line-height:1.1;letter-spacing:-.02em;word-break:break-word}
.big.neg{color:#FFD1DA}
.split{display:flex;height:16px;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.22)}
.split i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:.88rem;color:var(--mute)}
.hero .legend{color:rgba(255,255,255,.9)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.hero::after{content:"Rp";position:absolute;top:14px;right:14px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.95rem;color:#7A5200;background:radial-gradient(circle at 35% 30%,#FFF0A8,#F5BE2B 62%,#C98A00);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 6px 14px -4px rgba(0,0,0,.4)}
.hero.pop::after{animation:flip .85s ease-out}
@keyframes flip{0%{transform:rotateY(0)}40%{transform:rotateY(360deg) translateY(-10px)}100%{transform:rotateY(720deg)}}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:16px}
.stat{border-top:4px solid var(--c)}
.stat p{margin:0;font-size:.9rem;color:var(--mute)}
.stat strong{display:block;font-size:clamp(1.2rem,4.5vw,1.55rem);font-weight:700;color:var(--c);word-break:break-word}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:16px}

form{display:grid;gap:10px}
label{display:grid;gap:4px;font-size:.88rem;color:var(--mute)}
input,select{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
input:focus,select:focus{border-color:var(--in)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg label{position:relative;margin:0}
.seg input{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer}
.seg span{display:block;padding:10px 2px;text-align:center;font-size:.85rem;color:var(--ink);border:1px solid var(--line);border-radius:12px;transition:transform .12s}
.seg input:checked+span{background:var(--c);border-color:var(--c);color:var(--bt);font-weight:600;transform:scale(1.03)}
.seg input:focus-visible+span{outline:2px solid var(--save);outline-offset:2px}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(140px,100%),1fr));gap:10px}
.sub{display:none}.sub.show{display:grid}
.lnk{padding:0;border:0;background:none;text-align:left;font-size:.88rem;color:var(--out);text-decoration:underline}
.lnk[hidden]{display:none}
.go{min-height:48px;padding:12px;border:0;border-radius:14px;font-size:1.02rem;font-weight:700;color:var(--bt);background:linear-gradient(135deg,var(--in),var(--save))}
.go:hover{filter:brightness(1.08)}

.cat{display:grid;gap:12px}
.cat p{display:flex;justify-content:space-between;gap:8px;margin:0 0 4px;font-size:.93rem}
.bar{display:block;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px}
.cat div:nth-child(5n+1) i{background:#E0506E}.cat div:nth-child(5n+2) i{background:#F08A3C}.cat div:nth-child(5n+3) i{background:#E2B42A}.cat div:nth-child(5n+4) i{background:#8A5CD6}.cat div:nth-child(5n+5) i{background:#2D9CB0}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
svg{display:block;width:100%;min-width:520px;height:auto}
.bi{fill:var(--in)}.bo{fill:var(--out)}
svg text{fill:var(--mute);font-size:10px;font-family:inherit}
table{width:100%;min-width:520px;border-collapse:collapse}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);font-size:.93rem}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--mute)}
tfoot td{font-weight:700;border-bottom:0}
.tx{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx time{min-width:52px;padding:3px 8px;text-align:center;font-size:.85rem;color:var(--mute);background:var(--bg);border-radius:8px}
.tx small{display:block;color:var(--mute);overflow-wrap:anywhere}
.tx b{white-space:nowrap}
.tx .x{width:40px;height:40px;border:0;background:none;font-size:1.1rem;color:var(--mute);border-radius:10px}
.empty{margin:0;color:var(--mute)}
.empty button{margin-top:10px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.pos{color:var(--in)}.min{color:var(--out)}.sv{color:var(--save)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;padding:10px 18px;border-radius:999px;font-weight:600;color:var(--bg);background:var(--ink);animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translate(-50%,12px)}}
.conf{position:fixed;z-index:60;pointer-events:none;margin:-10px 0 0 -10px;font-size:1.4rem}

@supports ((-webkit-background-clip:text) or (background-clip:text)){
h1{background:linear-gradient(90deg,var(--in),var(--save),var(--out));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}}
@supports (color:color-mix(in srgb,red,blue)){
body{background:radial-gradient(color-mix(in srgb,var(--ink) 10%,transparent) 1.3px,transparent 1.4px) 0 0/26px 26px,radial-gradient(640px 340px at 92% -4%,color-mix(in srgb,var(--glow) 28%,transparent),transparent),radial-gradient(520px 320px at -6% 30%,color-mix(in srgb,var(--in) 20%,transparent),transparent),radial-gradient(520px 300px at 100% 85%,color-mix(in srgb,var(--out) 16%,transparent),transparent),var(--bg)}
.card{border-color:color-mix(in srgb,var(--glow) 40%,var(--line));box-shadow:0 16px 32px -18px var(--glow)}
.hero{box-shadow:0 18px 40px -16px var(--glow)}
.stat{background:color-mix(in srgb,var(--c) 14%,var(--card))}
input,select{background:color-mix(in srgb,var(--ink) 6%,var(--card))}
tfoot tr{background:color-mix(in srgb,var(--in) 14%,transparent)}
.tx:hover{background:color-mix(in srgb,var(--in) 8%,transparent)}}
@media (min-width:900px){main{padding-top:32px}.card{padding:22px}.hero{padding:28px}.hero::after{width:60px;height:60px;font-size:1.1rem}}
@media (max-width:380px){main{padding:14px 10px 48px}.card{padding:14px}.nav b{min-width:104px}.tx{gap:6px}}
@media (max-width:520px){.tx{grid-template-columns:auto minmax(0,1fr) auto;row-gap:2px}.tx time{grid-row:1/3;align-self:start}.tx b{grid-column:2;grid-row:2}.tx .x{grid-column:3;grid-row:1/3}}
@media (prefers-reduced-motion:reduce){.hero.pop::after{animation:none}button:active{transform:none}}
</style>
</head>
<body>
<main>
  <header class="top">
    <h1>Catatan Keuangan</h1>
    <div class="nav">
      <button class="ib" id="prev" aria-label="Bulan sebelumnya">‹</button>
      <b id="mlabel"></b>
      <button class="ib" id="next" aria-label="Bulan berikutnya">›</button>
      <button class="ib" id="skinbtn" aria-label="Ganti tema" title="Ganti tema">🎨</button>
      <button class="ib" id="sndbtn" aria-label="Suara" aria-pressed="true">🔊</button>
    </div>
  </header>
  <p class="sync">💾 Progres tersimpan otomatis di browser ini.</p>

  <section class="card hero" id="hero"></section>
  <section class="stats" id="stats"></section>

  <div class="cols">
    <section class="card">
      <h2>Catat transaksi</h2>
      <form id="f">
        <div class="seg" role="radiogroup" aria-label="Jenis transaksi">
          <label style="--c:var(--in)"><input type="radio" name="type" value="in" checked><span>Pemasukan</span></label>
          <label style="--c:var(--out)"><input type="radio" name="type" value="out"><span>Pengeluaran</span></label>
          <label style="--c:var(--save)"><input type="radio" name="type" value="save"><span>Tabungan</span></label>
        </div>
        <div class="row2">
          <label>Tanggal<input type="date" id="date" required></label>
          <label>Kategori<select id="cat"></select></label>
        </div>
        <label class="sub" id="newwrap">Nama kategori baru<input type="text" id="newcat" maxlength="24" placeholder="Contoh: Parkir, Jajan, Uang dari mamah"></label>
        <button type="button" class="lnk" id="delcat" hidden>Hapus kategori ini (transaksi lama tetap ada)</button>
        <label>Jumlah<input type="text" id="amt" inputmode="numeric" autocomplete="off" placeholder="Contoh: Rp 50.000" required></label>
        <label>Catatan (opsional)<input type="text" id="note" maxlength="60" placeholder="Contoh: makan siang"></label>
        <button class="go" type="submit">Simpan transaksi</button>
      </form>
    </section>
    <section class="card">
      <h2>Pengeluaran per kategori</h2>
      <div class="cat" id="catlist"></div>
    </section>
  </div>

  <section class="card"><h2>Per hari</h2><div class="scroll" id="daily"></div></section>
  <section class="card"><h2>Rekap per minggu</h2><div class="scroll" id="weekly"></div></section>
  <section class="card"><h2>Riwayat transaksi</h2><div id="list"></div></section>
</main>

<script>
(function () {
'use strict';
var KEY = 'keuangan:v1', CKEY = 'keuangan:cats:v1', SKEY = 'keuangan:skin', MKEY = 'keuangan:sound';
var CATS = {
  in: ['Gaji', 'Usaha', 'Bonus', 'Lainnya'],
  out: ['Makan', 'Transport', 'Tagihan', 'Belanja', 'Hiburan', 'Kesehatan', 'Lainnya'],
  save: ['Tabungan', 'Dana darurat', 'Investasi', 'Lainnya']
};
var NAME = { in: 'Pemasukan', out: 'Pengeluaran', save: 'Tabungan' };
var SKINS = [['arcade', 'Arcade 🕹️'], ['sakura', 'Sakura 🌸'], ['samudra', 'Samudra 🌊'], ['galaksi', 'Galaksi 🌌'], ['matcha', 'Matcha 🍵'], ['boba', 'Boba 🧋'], ['emas', 'Emas 👑'], ['cyber', 'Cyber 🤖'], ['permen', 'Permen 🍭'], ['sunset', 'Sunset 🌅']];
var NEWCAT = '__new__';
var $ = function (id) { return document.getElementById(id); };
var pad = function (n) { return String(n).padStart(2, '0'); };
var nf = new Intl.NumberFormat('id-ID');
var rp = function (n) { return (n < 0 ? '−' : '') + 'Rp\u00A0' + nf.format(Math.abs(Math.round(n))); };
var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
var reduce = function () { return window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches; };

function get(k, def) { try { var v = JSON.parse(localStorage.getItem(k)); return v === null ? def : v; } catch (e) { return def; } }
function put(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

var tx = get(KEY, []); if (!Array.isArray(tx)) tx = [];
var custom = get(CKEY, {}); if (!custom || typeof custom !== 'object') custom = {};
var skin = get(SKEY, 'arcade');
var sndOn = get(MKEY, true) !== false;
var now = new Date();
var ym = now.getFullYear() + '-' + pad(now.getMonth() + 1);
var shownNet = 0;

function sum(list, type) { return list.filter(function (t) { return t.type === type; }).reduce(function (a, t) { return a + t.amt; }, 0); }
function curType() { return document.querySelector('input[name=type]:checked').value; }
function catsOf(type) { return CATS[type].concat(custom[type] || []); }

/* ---------- Suara (Web Audio, tanpa file) ---------- */
var actx, master;
function ensure() {
  if (actx) return;
  var AC = window.AudioContext || window.webkitAudioContext;
  actx = new AC();
  master = actx.createGain(); master.gain.value = 0.9; master.connect(actx.destination);
  var dl = actx.createDelay(), fb = actx.createGain(), wet = actx.createGain();
  dl.delayTime.value = 0.17; fb.gain.value = 0.3; wet.gain.value = 0.28;
  master.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(actx.destination);
}
function tone(f, t0, d, type, vol, f2) {
  var o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + d + 0.03);
}
function bell(f, t0, d, vol) { tone(f, t0, d, 'sine', vol); tone(f * 2.76, t0, d * 0.5, 'sine', vol * 0.35); }
function sfx(name) {
  if (!sndOn) return;
  try {
    ensure();
    if (actx.state === 'suspended') actx.resume();
    var t = actx.currentTime;
    if (name === 'tap') tone(480, t, 0.09, 'sine', 0.14, 1000);
    else if (name === 'in') { [1319, 1568, 2093].forEach(function (f, i) { bell(f, t + i * 0.07, 0.5, 0.16); }); tone(220, t, 0.08, 'square', 0.05, 110); }
    else if (name === 'out') { tone(700, t, 0.35, 'sawtooth', 0.07, 140); bell(330, t + 0.12, 0.4, 0.12); }
    else if (name === 'save') { [523, 659, 784, 1047, 1319].forEach(function (f, i) { bell(f, t + i * 0.09, 0.6, 0.16); }); [523, 659, 784].forEach(function (f) { tone(f, t + 0.5, 0.8, 'triangle', 0.08); }); }
    else if (name === 'del') { tone(880, t, 0.16, 'sine', 0.12, 440); bell(392, t + 0.1, 0.3, 0.09); }
    else if (name === 'skin') [784, 988, 1175, 1568].forEach(function (f, i) { bell(f, t + i * 0.06, 0.4, 0.12); });
  } catch (e) {}
}
function setSnd(on) {
  sndOn = on;
  $('sndbtn').textContent = on ? '🔊' : '🔇';
  $('sndbtn').setAttribute('aria-pressed', on);
  put(MKEY, on);
}

/* ---------- Tema, toast, efek ---------- */
function toast(m) {
  var d = document.createElement('div');
  d.className = 'toast'; d.textContent = m; document.body.appendChild(d);
  setTimeout(function () { d.remove(); }, 1800);
}
function setSkin(s, say) {
  var found = SKINS.filter(function (k) { return k[0] === s; })[0] || SKINS[0];
  skin = found[0]; document.documentElement.setAttribute('data-skin', skin); put(SKEY, skin);
  if (say) { toast('Tema ' + found[1]); sfx('skin'); }
}
function flipCoin() {
  var h = $('hero');
  h.classList.remove('pop'); void h.offsetWidth; h.classList.add('pop');
}
function burst(type) {
  if (reduce() || !Element.prototype.animate) return;
  var em = { in: ['🪙', '💸', '✨'], out: ['💨', '🧾', '💦'], save: ['🐷', '⭐', '✨', '🪙'] }[type] || ['✨'];
  var r = $('hero').getBoundingClientRect();
  var x0 = Math.min(innerWidth - 20, Math.max(20, r.right - 40)), y0 = Math.max(70, r.top + 40);
  for (var i = 0; i < 22; i++) {
    (function (i) {
      var s = document.createElement('span');
      s.className = 'conf'; s.textContent = em[i % em.length];
      s.style.left = x0 + 'px'; s.style.top = y0 + 'px';
      document.body.appendChild(s);
      var a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 170;
      var an = s.animate([
        { transform: 'translate(0,0) scale(.4)', opacity: 1 },
        { transform: 'translate(' + Math.cos(a) * v + 'px,' + (Math.sin(a) * v - 60) + 'px) scale(1.1) rotate(' + Math.round(Math.random() * 360) + 'deg)', opacity: 1, offset: 0.6 },
        { transform: 'translate(' + Math.cos(a) * v * 1.1 + 'px,' + (Math.sin(a) * v + 140) + 'px) scale(.8)', opacity: 0 }
      ], { duration: 1100 + Math.random() * 500, easing: 'ease-out' });
      an.onfinish = function () { s.remove(); };
    })(i);
  }
}
function animateNet() {
  var el = document.querySelector('.big');
  if (!el) return;
  var to = Number(el.getAttribute('data-v')), from = shownNet;
  shownNet = to;
  if (from === to || reduce()) return;
  var t0 = performance.now(), dur = 700;
  (function step(t) {
    var k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = rp(from + (to - from) * e);
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}

/* ---------- Tampilan ---------- */
function render() {
  var ymp = ym.split('-'), y = Number(ymp[0]), m = Number(ymp[1]);
  var days = new Date(y, m, 0).getDate();
  $('mlabel').textContent = new Date(y, m - 1, 1).toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
  var list = tx.filter(function (t) { return t.date.indexOf(ym) === 0; });
  var inc = sum(list, 'in'), out = sum(list, 'out'), sav = sum(list, 'save'), net = inc - out - sav;
  var pct = function (v) { return inc > 0 ? Math.round(v / inc * 100) : 0; };
  var w = function (v) { return inc > 0 ? Math.max(0, Math.min(100, v / inc * 100)) : 0; };
  var rest = Math.max(0, net);

  $('hero').innerHTML =
    '<p class="lbl">Saldo bersih bulan ini</p>' +
    '<div class="big' + (net < 0 ? ' neg' : '') + '" data-v="' + net + '">' + rp(net) + '</div>' +
    '<div class="split" role="img" aria-label="Pembagian pemasukan">' +
      '<i style="width:' + w(out) + '%;background:var(--out)"></i>' +
      '<i style="width:' + w(sav) + '%;background:var(--save)"></i>' +
      '<i style="width:' + w(rest) + '%;background:var(--in)"></i></div>' +
    '<div class="legend">' +
      '<span><span class="dot" style="background:var(--out)"></span>Pengeluaran ' + pct(out) + '%</span>' +
      '<span><span class="dot" style="background:var(--save)"></span>Tabungan ' + pct(sav) + '%</span>' +
      '<span><span class="dot" style="background:var(--in)"></span>Sisa ' + pct(rest) + '%</span></div>' +
    '<p class="lbl" style="margin-top:10px;font-size:.88rem">Saldo bersih = pemasukan − pengeluaran − tabungan.</p>';

  var card = function (c, icon, label, v, note) {
    return '<div class="card stat" style="--c:' + c + '"><p>' + icon + ' ' + label + '</p><strong>' + rp(v) + '</strong><p>' + note + '</p></div>';
  };
  $('stats').innerHTML =
    card('var(--in)', '💵', 'Pemasukan', inc, list.filter(function (t) { return t.type === 'in'; }).length + ' transaksi') +
    card('var(--out)', '🛒', 'Pengeluaran', out, pct(out) + '% dari pemasukan') +
    card('var(--save)', '🐷', 'Tabungan', sav, pct(sav) + '% dari pemasukan');

  var byCat = {};
  list.filter(function (t) { return t.type === 'out'; }).forEach(function (t) { byCat[t.cat] = (byCat[t.cat] || 0) + t.amt; });
  var cats = Object.keys(byCat).map(function (k) { return [k, byCat[k]]; }).sort(function (a, b) { return b[1] - a[1]; });
  $('catlist').innerHTML = cats.length ? cats.map(function (c) {
    return '<div><p><span>' + esc(c[0]) + '</span><b>' + rp(c[1]) + ' · ' + Math.round(c[1] / out * 100) + '%</b></p>' +
      '<span class="bar"><i style="width:' + (c[1] / out * 100) + '%"></i></span></div>';
  }).join('') : '<p class="empty">Belum ada pengeluaran bulan ini.</p>';

  var di = [], dout = [], d;
  for (d = 0; d <= days; d++) { di.push(0); dout.push(0); }
  list.forEach(function (t) {
    var dd = Number(t.date.slice(8, 10));
    if (t.type === 'in') di[dd] += t.amt; else if (t.type === 'out') dout[dd] += t.amt;
  });
  var mx = Math.max.apply(null, [1].concat(di, dout));
  var W = 640, H = 170, bw = W / days, ch = H - 22;
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Grafik pemasukan dan pengeluaran harian"><line x1="0" x2="' + W + '" y1="' + ch + '" y2="' + ch + '" stroke="var(--line)"/>';
  for (d = 1; d <= days; d++) {
    var x = (d - 1) * bw, a = di[d] / mx * (ch - 6), b = dout[d] / mx * (ch - 6);
    if (a > 0) svg += '<rect class="bi" x="' + (x + bw * 0.1) + '" y="' + (ch - a) + '" width="' + bw * 0.38 + '" height="' + a + '" rx="2"><title>Tgl ' + d + ' pemasukan ' + rp(di[d]) + '</title></rect>';
    if (b > 0) svg += '<rect class="bo" x="' + (x + bw * 0.52) + '" y="' + (ch - b) + '" width="' + bw * 0.38 + '" height="' + b + '" rx="2"><title>Tgl ' + d + ' pengeluaran ' + rp(dout[d]) + '</title></rect>';
    if (d === 1 || d % 5 === 0 || d === days) svg += '<text x="' + (x + bw / 2) + '" y="' + (H - 6) + '" text-anchor="middle">' + d + '</text>';
  }
  $('daily').innerHTML = svg + '</svg><div class="legend"><span><span class="dot" style="background:var(--in)"></span>Pemasukan</span><span><span class="dot" style="background:var(--out)"></span>Pengeluaran</span></div>';

  var weeks = Math.ceil(days / 7), rows = '', k;
  for (k = 1; k <= weeks; k++) {
    var wl = list.filter(function (t) { return Math.ceil(Number(t.date.slice(8, 10)) / 7) === k; });
    var wa = sum(wl, 'in'), wb = sum(wl, 'out'), wc = sum(wl, 'save');
    rows += '<tr><td>Minggu ' + k + ' (tgl ' + ((k - 1) * 7 + 1) + '–' + Math.min(k * 7, days) + ')</td><td class="pos">' + rp(wa) + '</td><td class="min">' + rp(wb) + '</td><td class="sv">' + rp(wc) + '</td><td>' + rp(wa - wb - wc) + '</td></tr>';
  }
  $('weekly').innerHTML = '<table><thead><tr><th>Periode</th><th>Pemasukan</th><th>Pengeluaran</th><th>Tabungan</th><th>Saldo bersih</th></tr></thead><tbody>' + rows +
    '</tbody><tfoot><tr><td>Total bulan ini</td><td class="pos">' + rp(inc) + '</td><td class="min">' + rp(out) + '</td><td class="sv">' + rp(sav) + '</td><td>' + rp(net) + '</td></tr></tfoot></table>';

  var sorted = list.slice().sort(function (p, q) { return q.date.localeCompare(p.date) || q.id - p.id; });
  $('list').innerHTML = sorted.length ? sorted.map(function (t) {
    var cls = t.type === 'in' ? 'pos' : t.type === 'out' ? 'min' : 'sv';
    return '<div class="tx"><time>' + t.date.slice(8, 10) + '/' + t.date.slice(5, 7) + '</time>' +
      '<div>' + esc(t.cat) + '<small>' + NAME[t.type] + (t.note ? ' · ' + esc(t.note) : '') + '</small></div>' +
      '<b class="' + cls + '">' + (t.type === 'in' ? '+' : '−') + rp(t.amt) + '</b>' +
      '<button class="x" data-id="' + t.id + '" aria-label="Hapus transaksi">✕</button></div>';
  }).join('') : '<p class="empty">Belum ada transaksi di bulan ini. Isi formulir di atas untuk mulai mencatat.<br><button id="demo" type="button">Muat data contoh</button></p>';

  animateNet();
}

/* ---------- Form & kategori ---------- */
function catChange() {
  var isNew = $('cat').value === NEWCAT;
  $('newwrap').classList.toggle('show', isNew);
  $('newcat').required = isNew;
  $('delcat').hidden = (custom[curType()] || []).indexOf($('cat').value) < 0;
}
function fillCats(sel) {
  $('cat').innerHTML = catsOf(curType()).map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('') +
    '<option value="' + NEWCAT + '">＋ Kategori baru…</option>';
  if (sel) $('cat').value = sel;
  catChange();
}
function setDate() {
  var p = ym.split('-'), y = Number(p[0]), m = Number(p[1]);
  var isNow = y === now.getFullYear() && m === now.getMonth() + 1;
  $('date').value = ym + '-' + pad(isNow ? now.getDate() : 1);
  $('date').min = ym + '-01';
  $('date').max = ym + '-' + pad(new Date(y, m, 0).getDate());
}
function shift(n) {
  var p = ym.split('-'), d = new Date(Number(p[0]), Number(p[1]) - 1 + n, 1);
  ym = d.getFullYear() + '-' + pad(d.getMonth() + 1);
  setDate(); render();
}

Array.prototype.forEach.call(document.querySelectorAll('input[name=type]'), function (r) { r.addEventListener('change', function () { fillCats(); }); });
$('cat').addEventListener('change', catChange);
$('delcat').onclick = function () {
  var t = curType(), c = $('cat').value;
  custom[t] = (custom[t] || []).filter(function (x) { return x !== c; });
  put(CKEY, custom); fillCats();
};
$('prev').onclick = function () { shift(-1); };
$('next').onclick = function () { shift(1); };
$('skinbtn').onclick = function () {
  var i = 0; SKINS.forEach(function (k, n) { if (k[0] === skin) i = n; });
  setSkin(SKINS[(i + 1) % SKINS.length][0], true);
};
$('sndbtn').onclick = function () { var was = sndOn; setSnd(!was); if (!was) sfx('tap'); };
$('amt').addEventListener('input', function (e) {
  var d = e.target.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 12);
  e.target.value = d ? 'Rp\u00A0' + nf.format(Number(d)) : '';
});

$('f').addEventListener('submit', function (e) {
  e.preventDefault();
  var amt = Number($('amt').value.replace(/\D/g, ''));
  if (!(amt > 0)) return;
  var typ = curType(), cat = $('cat').value;
  if (cat === NEWCAT) {
    cat = $('newcat').value.trim().replace(/\s+/g, ' ');
    if (!cat) { $('newcat').focus(); return; }
    var ada = catsOf(typ).filter(function (c) { return c.toLowerCase() === cat.toLowerCase(); })[0];
    if (ada) cat = ada; else { (custom[typ] = custom[typ] || []).push(cat); put(CKEY, custom); }
  }
  tx.push({ id: Date.now(), date: $('date').value, type: typ, cat: cat, amt: amt, note: $('note').value.trim() });
  put(KEY, tx);
  $('amt').value = ''; $('note').value = ''; $('newcat').value = '';
  fillCats(cat); render(); sfx(typ); flipCoin(); burst(typ);
});

document.addEventListener('click', function (e) {
  var x = e.target.closest('.x');
  if (x) { tx = tx.filter(function (t) { return String(t.id) !== x.getAttribute('data-id'); }); put(KEY, tx); render(); sfx('del'); return; }
  if (e.target.id === 'demo') {
    var d = function (n) { return ym + '-' + pad(n); }, base = Date.now();
    [['in', 'Gaji', 5000000, 1, 'Gaji bulanan'], ['in', 'Usaha', 750000, 12, 'Jualan online'],
     ['out', 'Tagihan', 600000, 3, 'Listrik dan internet'], ['out', 'Makan', 45000, 4, 'Makan siang'],
     ['out', 'Transport', 120000, 8, 'Bensin'], ['out', 'Belanja', 350000, 10, 'Kebutuhan rumah'],
     ['out', 'Makan', 180000, 15, 'Makan keluarga'], ['out', 'Hiburan', 100000, 22, 'Nonton'],
     ['save', 'Tabungan', 1000000, 2, 'Tabungan bulanan'], ['save', 'Dana darurat', 300000, 16, '']
    ].forEach(function (r, i) { tx.push({ id: base + i, date: d(r[3]), type: r[0], cat: r[1], amt: r[2], note: r[4] }); });
    put(KEY, tx); render(); sfx('save'); flipCoin(); burst('save');
    return;
  }
  var b = e.target.closest('button');
  if (b && !b.classList.contains('go') && b.id !== 'sndbtn' && b.id !== 'skinbtn') sfx('tap');
});
document.addEventListener('change', function (e) {
  if (e.target.matches && e.target.matches('select, input[type=radio]')) sfx('tap');
});

/* ---------- Mulai ---------- */
setSkin(skin);
setSnd(sndOn);
fillCats(); setDate(); render();
})();
</script>
</body>
</html>
